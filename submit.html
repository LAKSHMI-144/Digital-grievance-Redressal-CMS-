<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Grievance | GrievancePortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .bg-animate { background-size: 400% 400%; animation: bgMove 15s ease infinite; background-image: linear-gradient(-45deg, #0B0F19, #0f172a, #1e1b4b, #064e3b); }
        @keyframes bgMove { 0% { background-position: 0% 50% } 50% { background-position: 100% 50% } 100% { background-position: 0% 50% } }
    </style>
</head>
<body class="bg-animate text-white font-inter min-h-screen flex items-center justify-center p-6 selection:bg-purple-500/30">

    <div class="w-full max-w-3xl glass-card rounded-3xl p-8 md:p-12 shadow-2xl relative z-10 overflow-hidden">
        <!-- Top decorative gradient -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-500"></div>
        
        <div class="flex items-center justify-between mb-10">
            <div>
                <h2 class="text-3xl font-extrabold tracking-tight">File a Grievance</h2>
                <p class="text-slate-400 text-sm mt-1">Please provide accurate details below.</p>
            </div>
            <a href="index.html" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 text-slate-400 hover:text-white transition-colors border border-white/10"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <form id="submitComplaintForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Subject Title <span class="text-red-500">*</span></label>
                    <input type="text" id="title" required placeholder="e.g. Broken Wi-Fi router" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Category <span class="text-red-500">*</span></label>
                    <!-- Make sure text color targets options as well so they are visible -->
                    <select id="category" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium appearance-none">
                        <option value="Academic">Academic</option>
                        <option value="Non-Academic">Non-Academic</option>
                    </select>
                </div>
            </div>
            
            <div id="departmentContainer" class="hidden">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Department <span class="text-red-500">*</span></label>
                <select id="department" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium appearance-none">
                </select>
            </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Priority <span class="text-red-500">*</span></label>
                <select id="priority" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium appearance-none">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Detailed Description <span class="text-red-500">*</span></label>
                <textarea id="description" required rows="4" placeholder="Describe the issue clearly..." class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium resize-none"></textarea>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Evidence Attachment <span class="text-slate-500 text-[10px] normal-case tracking-normal ml-2">(Optional Photo)</span></label>
                <div class="flex items-center gap-4">
                    <label class="cursor-pointer bg-white/5 hover:bg-white/10 border border-dashed border-white/20 rounded-xl px-6 py-4 flex flex-col items-center justify-center transition-colors text-slate-400 hover:text-white flex-1 h-32">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl mb-2"></i>
                        <span class="text-sm font-medium">Click to upload image</span>
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                    </label>
                    <img id="imagePreview" class="hidden rounded-xl object-cover border border-white/10 shadow-lg h-32 w-32 bg-black/50">
                </div>
            </div>
            
            <div class="pt-4 mt-8 border-t border-white/10" id="formContainer">
                <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-lg transition-all shadow-lg shadow-emerald-500/25 active:scale-[0.98] flex items-center justify-center gap-2">
                    Submit Grievance <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </form>

        <div id="successState" class="hidden text-center py-10 animate-[fadeIn_0.3s_ease-out]">
            <div class="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 border-2 border-emerald-500">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-3xl font-extrabold text-white mb-3">Submitted Successfully</h3>
            <p class="text-slate-400">Your complaint has been securely forwarded to the assigned department.</p>
            
            <div class="mt-8 p-6 bg-black/30 rounded-2xl border border-white/5 inline-block">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Your Tracking ID</p>
                <p id="displayId" class="text-3xl font-mono font-bold text-emerald-400 tracking-wider"></p>
            </div>
            
            <div class="mt-10">
                <a href="track.html" class="text-white bg-white/10 hover:bg-white/20 px-8 py-3 rounded-xl font-bold transition-colors inline-block tracking-wide">Track Status Now</a>
            </div>
        </div>
    </div>
    
    <script src="assets/script.js"></script>
</body>
</html>
