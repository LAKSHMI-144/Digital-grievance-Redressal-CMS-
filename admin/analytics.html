<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics | AdminPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-[#0B0F19] text-white font-inter h-screen overflow-hidden flex selection:bg-purple-500/30 relative">

    <div class="absolute top-[-10%] right-[-10%] w-[50rem] h-[50rem] rounded-full bg-purple-600/10 blur-[150px] mix-blend-screen pointer-events-none z-0 animate-blob"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[50rem] h-[50rem] rounded-full bg-indigo-600/10 blur-[150px] mix-blend-screen pointer-events-none z-0 animate-blob" style="animation-delay: 2s;"></div>

    <!-- Sidebar -->
    <aside class="w-64 glass-panel border-r border-white/5 flex flex-col transition-all duration-300 relative z-20">
        <div class="p-6 border-b border-white/5 flex flex-col justify-center">
            <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-600/30 mb-3"><i class="fa-solid fa-user-shield text-white"></i></div>
            <h1 class="font-bold text-lg tracking-tight">Admin<span class="text-emerald-400">Pro</span></h1>
            <p class="text-xs text-slate-500 mt-1">Grievance Management</p>
        </div>

        <nav class="flex-1 p-4 flex flex-col gap-2 relative z-10">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-4 mb-2 pl-3">Menu</p>
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 bg-transparent hover:bg-white/5 text-slate-400 hover:text-white rounded-xl font-medium border border-transparent transition-all group">
                <i class="fa-solid fa-border-all w-5 text-center group-hover:text-emerald-400 transition-colors"></i> Overview
            </a>
            <a href="reports.html" class="flex items-center gap-3 px-3 py-2.5 bg-transparent hover:bg-white/5 text-slate-400 hover:text-white rounded-xl font-medium border border-transparent transition-all group">
                <i class="fa-solid fa-folder-open w-5 text-center group-hover:text-emerald-400 transition-colors"></i> Reports
            </a>
            <a href="analytics.html" class="flex items-center gap-3 px-3 py-2.5 bg-gradient-to-r from-emerald-500/20 to-emerald-500/5 text-emerald-400 rounded-xl font-medium border border-emerald-500/30 transition-all shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                <i class="fa-solid fa-chart-line w-5 text-center"></i> Analytics
            </a>
        </nav>

        <div class="p-4 border-t border-white/5">
            <button onclick="logout()" class="flex items-center justify-center gap-2 w-full py-2.5 bg-white/5 hover:bg-red-500/20 hover:text-red-400 text-slate-300 rounded-xl font-medium transition-all text-sm border border-white/5">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-20 glass-header border-b border-white/5 px-8 flex items-center justify-between z-10">
            <h2 class="text-xl font-bold text-slate-200">Deep <span class="text-purple-400">Analytics</span></h2>
            <div class="flex flex-col items-end">
                <p class="text-sm font-bold text-white">Super Admin</p>
                <div class="flex items-center gap-2 text-xs text-emerald-400"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- Trending Chart -->
                <div class="glass-card rounded-2xl p-6 border border-white/5 shadow-xl bg-white/[0.02]">
                    <h3 class="font-bold text-lg mb-4 text-slate-200">Submission Trends (Last 6 Months)</h3>
                    <div class="relative w-full h-64">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <!-- Category Breakdown -->
                <div class="glass-card rounded-2xl p-6 border border-white/5 shadow-xl bg-white/[0.02]">
                    <h3 class="font-bold text-lg mb-4 text-slate-200">Grievances by Category</h3>
                    <div class="relative w-full h-64 flex justify-center">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-2xl p-6 border border-white/5 shadow-xl bg-white/[0.02]">
                <h3 class="font-bold text-lg mb-4 text-slate-200">Resolution Time Distribution</h3>
                <div class="relative w-full h-64">
                    <canvas id="resolutionChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="../assets/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Chart.defaults.color = "rgba(255, 255, 255, 0.6)";
            Chart.defaults.font.family = "'Inter', sans-serif";

            try {
                // Fetch real data from our backend
                let response = await fetch('/api/complaints');
                let result = await response.json();
                let grievances = result.data || [];

                // Metrics for Departments dynamically
                let catCounts = {};
                // Metrics for Trends (Months)
                let months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                let trendCounts = [0, 0, 0, 0, 0, 0]; // Last 6 months
                let currentMonthIdx = new Date().getMonth();
                let trendLabels = [];
                for (let i = 5; i >= 0; i--) {
                    let m = currentMonthIdx - i;
                    if (m < 0) m += 12;
                    trendLabels.push(months[m]);
                }

                grievances.forEach(g => {
                    // Tally Departments
                    let dept = g.department || 'Others';
                    catCounts[dept] = (catCounts[dept] || 0) + 1;
                    
                    // Tally Trends by Month
                    if (g.createdAt) {
                        let gMonth = new Date(g.createdAt).getMonth();
                        // Find if this month is in our last 6 months bucket
                        let labelIndex = trendLabels.indexOf(months[gMonth]);
                        if (labelIndex !== -1) {
                            trendCounts[labelIndex]++;
                        }
                    }
                });

                // Trend line chart
                const trendCtx = document.getElementById('trendChart').getContext('2d');
                new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: trendLabels,
                        datasets: [{
                            label: 'Grievances Filed',
                            data: trendCounts,
                            borderColor: '#10b981', // emerald-500
                            tension: 0.4,
                            borderWidth: 3,
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                            x: { grid: { color: 'rgba(255, 255, 255, 0.05)' } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });

                // Category polar chart
                const colors = ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#06b6d4', '#f97316'];
                const dynamicLabels = Object.keys(catCounts);
                const dynamicData = Object.values(catCounts);

                const catCtx = document.getElementById('categoryChart').getContext('2d');
                new Chart(catCtx, {
                    type: 'doughnut',
                    data: {
                        labels: dynamicLabels,
                        datasets: [{
                            data: dynamicData,
                            backgroundColor: colors.slice(0, dynamicLabels.length),
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        plugins: {
                            legend: { position: 'right', labels: { usePointStyle: true, padding: 20 } }
                        }
                    }
                });

                // Resolution bar chart - Still simulated based on statuses for visual demo
                let pending = grievances.filter(g => g.status === 'Pending').length;
                let inProg = grievances.filter(g => g.status === 'In Progress' || g.status === 'Assigned').length;
                let resolved = grievances.filter(g => g.status === 'Resolved').length;
                
                const resCtx = document.getElementById('resolutionChart').getContext('2d');
                new Chart(resCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Pending', 'In Progress', 'Resolved'],
                        datasets: [{
                            label: 'Ticket Status Distribution',
                            data: [pending, inProg, resolved],
                            backgroundColor: ['#f59e0b', '#3b82f6', '#10b981'],
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                            x: { grid: { display: false } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            } catch (error) {
                console.error("Error fetching live data. Falling back to dummy UI.", error);
            }
        });
    </script>
</body>
</html>
